<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="freshBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Rounded emerald background tile -->
  <rect width="64" height="64" rx="14" fill="url(#freshBg)"/>
  
  <!-- Subtle circular recycling loop arrows in crisp white -->
  <!-- Top-right clockwise arc with arrow -->
  <path d="M 32 10 A 22 22 0 0 1 54 32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <polygon points="54,26 58,34 50,33" fill="#ffffff" opacity="0.9"/>

  <!-- Bottom-left clockwise arc with arrow -->
  <path d="M 32 54 A 22 22 0 0 1 10 32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <polygon points="10,38 6,30 14,31" fill="#ffffff" opacity="0.9"/>

  <!-- Central clean white leaf representing fresh food recovery -->
  <path d="M 22 42 C 22 26 34 18 44 18 C 44 28 36 44 22 42 Z" fill="#ffffff"/>
  <!-- Leaf center vein -->
  <path d="M 23 41 C 28 35 34 29 43 20" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
</svg>
